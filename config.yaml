# ═══════════════════════════════════════════════════════════════════════
# Mon3ter 全局配置
# ═══════════════════════════════════════════════════════════════════════
# 这是整个应用的"控制面板"。
# 修改任何参数后重启 main.py 即可生效，无需改代码。
#
# 路径规则:
#   相对路径以 Mon3ter 项目根目录为基准 (即本文件所在目录)
#   绝对路径直接使用，不做转换
# ═══════════════════════════════════════════════════════════════════════

# ── 模型 ─────────────────────────────────────────────────────────────
models:
  # 加载参数 (修改后需重启生效)
  load:
    # 大语言模型 GGUF 文件路径
    llm_path: "models/llm/qwen2.5-7b-instruct-q4_k_m.gguf"

    # 上下文窗口 (token 数)
    n_ctx: 8192

    # GPU 层数: -1=全部, 0=纯CPU, 20=部分GPU
    n_gpu_layers: -1

    # 推理进程隔离: true=子进程(崩溃隔离), false=同进程(默认)
    use_worker: false

  # 默认采样参数 (每次对话可用参数)
  sampling:
    temperature: 0.7
    max_tokens: 1024

  # Embedding 模型
  embedding_model: "BAAI/bge-m3"
  embedding_device: "cpu"

# ── 人格 ─────────────────────────────────────────────────────────────
personality:
  # 角色卡文件路径
  character_file: "mon3ter/personality/character.yaml"

# ── 记忆 ─────────────────────────────────────────────────────────────
memory:
  # ChromaDB 向量库持久化目录
  chroma_path: "data/chroma"

  # SQLite 数据库路径
  sqlite_path: "data/summaries.db"

  # 每次检索返回的记忆条数
  retrieval_top_k: 5

  # 记忆压缩间隔 (小时), 0 = 不自动压缩
  compress_interval_hours: 24

# ── 联网 ─────────────────────────────────────────────────────────────
web:
  # 天气查询默认城市
  weather_city: "北京"

  # 天气缓存有效期 (秒), 3600 = 1小时
  weather_cache_ttl: 3600

  # 新闻缓存有效期 (秒), 7200 = 2小时
  news_cache_ttl: 7200

# ── 服务端 ───────────────────────────────────────────────────────────
server:
  # 只监听本机，不对外暴露
  host: "127.0.0.1"
  port: 9876

# ── 用户 ─────────────────────────────────────────────────────────────
user:
  # 初始称呼 (会被偏好学习覆盖)
  name: "用户"
